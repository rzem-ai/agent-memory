name: agent-memory

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: memory
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets:
      - db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  ollama-models:
    image: ollama/ollama:0.11.4
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull nomic-embed-text && ollama pull bge-m3
    depends_on:
      ollama:
        condition: service_healthy

  migrate:
    build:
      context: .
    image: ${AGENT_MEMORY_IMAGE:-agent-memory:local}
    restart: "no"
    user: node
    secrets:
      - db-password
    volumes:
      - ./docker/mcp.compose.toml:/etc/agent-memory/mcp.toml:ro
    entrypoint: ["node", "dist/cli/migrate.js"]
    command: ["--config", "/etc/agent-memory/mcp.toml"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  memory:
    build:
      context: .
    image: ${AGENT_MEMORY_IMAGE:-agent-memory:local}
    restart: unless-stopped
    init: true
    secrets:
      - db-password
      - memory-token
    volumes:
      - ./docker/mcp.compose.toml:/etc/agent-memory/mcp.toml:ro
    ports:
      - "${AGENT_MEMORY_BIND:-127.0.0.1}:${AGENT_MEMORY_PORT:-3010}:3010"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-models:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
  ollama-data:

secrets:
  db-password:
    environment: POSTGRES_PASSWORD
  memory-token:
    environment: AGENT_MEMORY_TOKEN
