# Cuts a GitHub release and publishes to npm when a version tag is pushed.
# The tag must point at a commit on main, and must match package.json.
#
#   npm version minor   # commits + tags vX.Y.Z
#   git push origin main --follow-tags
#
# Kept byte-identical with the sibling repo's release.yml; change both together.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A tag is its own ref and can point anywhere, so "released from main"
      # has to be asserted rather than assumed.
      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      # lint + typecheck + tests + build
      - run: npm run check

      # The release goes first: it is cheap to delete and recreate, whereas a
      # published npm version number can never be reused.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.2.3-rc.1 -> prerelease; v1.2.3 -> full release
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # Prereleases must not move the "latest" dist-tag.
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;
            *)   npm publish ;;
          esac
