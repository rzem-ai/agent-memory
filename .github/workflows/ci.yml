name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # lint + typecheck + tests + build. No service containers: the
      # repositories are faked and the HTTP tests bind an ephemeral port, so
      # nothing here needs Postgres or Ollama.
      - run: npm run check

  container:
    name: container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Secrets are file-sourced, so the model resolves without them present.
      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build application image
        run: docker build --tag agent-memory:ci .

      # The image ships no package manager and an Alpine base, so it scans
      # clean today. A failure here normally means the base image pin in the
      # Dockerfile needs bumping; genuinely unfixable findings go in
      # .trivyignore with a dated justification.
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agent-memory:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  opentofu:
    name: opentofu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installed from the release archive and pinned by checksum rather than
      # through a marketplace action: one fewer third-party action in the
      # supply chain, and the same pinning style as the Dockerfile's base image.
      - name: Install OpenTofu
        env:
          TOFU_VERSION: '1.10.6'
          TOFU_SHA256: 15b7bed76420b50da3e121769c43341df8cd57d751ca14e6dbe9c850124c6dac
        run: |
          curl -fsSL -o tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "${TOFU_SHA256}  tofu.zip" | sha256sum -c -
          unzip -q tofu.zip tofu
          sudo install -m 0755 tofu /usr/local/bin/tofu
          tofu version

      - name: Check formatting
        run: tofu fmt -check -recursive terraform

      # -backend=false: validation needs only the provider schemas, so this
      # gate wants no state, no credentials and no Docker daemon.
      - name: Validate modules and stack
        run: |
          for dir in terraform/modules/* terraform/stacks/*; do
            echo "::group::${dir}"
            tofu -chdir="${dir}" init -backend=false -input=false
            tofu -chdir="${dir}" validate
            echo "::endgroup::"
          done
