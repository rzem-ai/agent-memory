name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # lint + typecheck + tests + build. No service containers: the
      # repositories are faked and the HTTP tests bind an ephemeral port, so
      # nothing here needs Postgres or Ollama.
      - run: npm run check

  container:
    name: container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Compose model
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          RZEM_MEMORY_TOKEN: ci-placeholder

      - name: Build application image
        run: docker build --tag agent-memory:ci .
